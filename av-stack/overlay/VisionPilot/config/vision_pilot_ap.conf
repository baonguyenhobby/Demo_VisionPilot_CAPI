# VisionPilot AUTOSAR Adaptive (CAPI) configuration template
#
# Only VEHICLE I/O is a modelled ara::com service. The camera is never on the
# wire; it is selected by source.mode in vision_pilot.conf exactly as upstream:
#
#     source.mode = video   -> recorded clip, paths in vision_pilot_test.conf
#                              (development-host bench)
#     source.mode = v4l2    -> source.v4l2_device / source.v4l2_fps
#                              (UGV Rover, /dev/video0)
#
# In video mode source.input_vehicle_speed is NOT required: ego speed arrives
# as SpeedEvent over ara::com, so frame_speed.txt is the bench producer's input
# rather than VisionPilot's.
#
# The values below are InstanceSpecifiers, not topic names. Each is built as
#     <executable>/<root SWC prototype>/<port>
# from model/app/visionpilot_design.arxml, and is resolved to a SOME/IP instance
# by the ServiceInstanceToPortPrototypeMapping in model/integration/deployment.arxml.
# A typo surfaces at start-up as "malformed InstanceSpecifier" or as service
# discovery that never completes -- never as a silent no-op.

# REQUIRED port: ego speed in. Produced by the Control AA, which decodes it
# from the ESP32 telemetry frame (T:1001) on /dev/ttyTHS1.
ap.vehicle_status_instance      = visionpilotd/vp_root/RPort_VehicleStatus

# PROVIDED port: actuation out. Consumed by the Control AA supervisor, which
# validates and limits it, converts the bicycle-model pair to a velocity pair,
# and writes {'T':13,'X':linear,'Z':angular} to the ESP32.
ap.vehicle_control_instance     = visionpilotd/vp_root/PPort_VehicleControl

# PHM SupervisedEntity port. EMPTY ON PURPOSE for now: CAPI ships no example of
# PHM supervised-entity modelling anywhere in isoft/arxmls or samples, so the
# supervision model is not authored yet and checkpoints are dropped. The
# checkpoint calls stay in the code and cost nothing while this is empty.
# Fill it in once the PHM model exists; the value must be
# <executable>/<root SWC prototype>/<port>, like the two above.
ap.supervised_entity_instance   =

# Consumer-side staleness bound on the ego speed, in milliseconds.
# Deliberately independent of PHM: PHM watches the producer from outside, this
# watches the data actually received. Neither depends on the other. 0 disables.
#
# 200 ms is a placeholder. Tune it on the Orin Nano -- a bound tuned on a
# development host will produce false positives on a non-real-time kernel under
# CUDA load, and the brownout hazard under combined GPU + sensor load makes
# late cycles more likely on this board, not less.
ap.speed_stale_ms               = 200
